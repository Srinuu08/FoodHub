<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Create Account</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
    <div class="logo-container">
        <a href="index.html" class="brand-link">
            <img src="images/logo.png" alt="FoodHub Logo" width="80" height="80">
            <h1><span class="food">Food</span><span class="hub">Hub</span></h1>
        </a>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Open navigation">☰</button>
    <nav class="nav-container" id="mainNav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="cart.html" class="nav-link">Cart <span class="cart-badge" id="cartCount">0</span></a>
        <a href="login.html" class="nav-link" id="accountLink">Login</a>
    </nav>
</header>
    <main class="auth-container">
        <section class="login-container">
            <h1>Create Account</h1>
            <form id="signupForm">
                <label for="signupName">Full Name</label>
                <input type="text" id="signupName" required placeholder="Your name">
                <label for="signupUsername">Username</label>
                <input type="text" id="signupUsername" required placeholder="Choose a username">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" required placeholder="you@example.com">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" required minlength="6" placeholder="At least 6 characters">
                <label for="signupConfirm">Confirm Password</label>
                <input type="password" id="signupConfirm" required placeholder="Re-enter password">
                <button type="submit">Create Account</button>
                <p id="signupMessage" class="form-message"></p>
            </form>
            <p class="signup-text">Already have an account? <a href="login.html">Login</a></p>
        </section>
    </main>
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
