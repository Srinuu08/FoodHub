<!DOCTYPE html>
<html lang="en">
    <head>
        <title>FoodHub-Checkout</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        
    </head>
    <body >
        <header>
            <div class="logo-container">               
                <img src="images/logo.png" alt="FoodHub Logo" width="150" height="150">   
                <h1><span class="food">Food</span><span class="hub">Hub</span></h1>
            </div>
            <div class="nav-container">
            <a href="index.html" class="nav-link"><h2>Home</h2></a> 
            <a href="menu.html" class="nav-link"><h2>Menu</h2></a>
            <a href="cart.html" class="nav-link"><h2>Cart</h2></a>
            </div>
        </header>
    
      
        <div class="checkout-container">
        <h1>Checkout</h1>
        
        <section class="menu-section">

            <div class="menu-table">

                <div class="menu-header">
                    <span>Item</span>
                    <span>Price</span>
                    <span>Quantity</span>
                    <span>Total</span>
                </div>

                <div id="checkoutItems"></div>

            </div>


            <div class="total-container">

                <div id="checkoutTotal"></div>

            </div>


            <div class="place-order-container">
                <button class="checkout-button" onclick="placeOrder()">
                    PLACE ORDER
                </button>

            </div>

        </section>

        </div>


    <script src="js/checkout.js"></script>
    </body>
</html>
