<!DOCTYPE html>
<html lang="en">
    <head>
        <meta  charset="UTF-8">
        <meta  name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FoodHub-Login</title>
         <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <div class="logo-container">
               
                <img src="images/logo.png" alt="FoodHub Logo" width="150" height="150">   
                <h1><span class="food">Food</span><span class="hub">Hub</span></h1>
            </div>    
            <div class="home-container">
                    <a href="index.html" class="nav-link"><h2>Home</h2></a>
            </div>
            

        </header>
        <section class="login-container">
            <h1>Login</h1>
            <form id="loginForm">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required placeholder="Name!">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Password!">
                <button type="submit">Login</button>
        
            </form>
        </section>
    </body>
</html>
